name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform authenticated plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      TF_VAR_databricks_host: https://dbc-3e119ffc-1535.cloud.databricks.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::290909957115:role/github-actions-terraform-plan-f1-lakehouse
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -out=tfplan.binary 2>&1 | tee tfplan.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit "${exit_code}"

      - name: Publish Terraform plan summary
        if: always()
        shell: bash
        run: |
          echo "## Terraform Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** dev" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Exit code:** ${{ steps.plan.outputs.exit_code || 'not available' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Show plan output</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f tfplan.txt ]; then
            cat tfplan.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Terraform plan output file was not created." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment Terraform plan on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit_code || 'not available' }}
          PLAN_FILE: terraform/environments/dev/tfplan.txt
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- terraform-plan-comment -->';
            const planPath = process.env.PLAN_FILE;
            const exitCode = process.env.PLAN_EXIT_CODE;
            const maxPlanLength = 60000;

            let plan = 'Terraform plan output file was not created.';
            if (fs.existsSync(planPath)) {
              plan = fs.readFileSync(planPath, 'utf8');
            }

            if (plan.length > maxPlanLength) {
              plan = `${plan.slice(0, maxPlanLength)}\n\n... plan output truncated. See the workflow logs for the full output.`;
            }

            const body = [
              marker,
              '## Terraform Plan',
              '',
              '**Environment:** `dev`',
              `**Exit code:** \`${exitCode}\``,
              '',
              '<details><summary>Show plan output</summary>',
              '',
              '```text',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const previous = comments.data.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
