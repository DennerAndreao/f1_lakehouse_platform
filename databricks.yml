bundle:
  name: f1_lakehouse_platform

include:
  - databricks/resources/*.yml

variables:
  databricks_host:
    description: Databricks workspace host used by the bundle target.
    default: https://dbc-3e119ffc-1535.cloud.databricks.com

  existing_cluster_id:
    description: Existing interactive or job-capable cluster used to run the first full-refresh workflow.
    default: REPLACE_WITH_CLUSTER_ID

workspace:
  host: ${var.databricks_host}

sync:
  include:
    - databricks/notebooks/**/*.py
    - databricks/resources/*.yml
    - databricks/README.md
  exclude:
    - terraform/**
    - docs/**
    - .github/**

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
