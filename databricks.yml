bundle:
  name: f1_lakehouse_platform

include:
  - databricks/resources/*.yml

sync:
  include:
    - databricks/notebooks/**/*.py
    - databricks/resources/*.yml
    - databricks/README.md
  exclude:
    - terraform/**
    - docs/**
    - .github/**

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-3e119ffc-1535.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
